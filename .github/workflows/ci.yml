name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read # least privilege for the workflow token

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements.txt && pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: bandit -q -r main.py
      - run: pip-audit --require-hashes -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-fund
      - run: npx tsc --noEmit
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
